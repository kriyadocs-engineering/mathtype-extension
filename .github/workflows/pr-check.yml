name: PR Check

on:
  pull_request:
    types: [edited, opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr_check:
    uses: kriyadocs-engineering/kriya-github-workflows/.github/workflows/pr-check.yml@main # if you want alternatively pin to tag version
